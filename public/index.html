<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mari, a assistente do MARÉ</title>
<style>
  :root {
    --creme: #F6F7FC; --creme-2: #E9ECFF; --azul: #465EFF; --azul-esc: #3A50F0; --texto: #0E1230; --texto-60: #585D7E;
    --crise: #FFF4E5; --crise-borda: #B85C00; --branco: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --creme: #0E1230; --creme-2: #1C2250; --azul: #8C9BFF; --azul-esc: #465EFF; --texto: #F6F7FC; --texto-60: #B4B8D6;
      --crise: #3A2A12; --crise-borda: #F0A040; --branco: #FFFFFF; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--creme); color: var(--texto); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; min-height: 100dvh; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 8px 0 0; font-size: 1.5rem; }
  .aviso { margin: 0; font-size: .85rem; color: var(--texto-60); }
  .rapidos { display: flex; flex-wrap: wrap; gap: 8px; }
  .rapidos button { border: 1px solid var(--azul); background: transparent; color: var(--azul); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  #msgs { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 4px 0; }
  .mm { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; }
  .mm.eu { align-self: flex-end; background: var(--azul-esc); color: var(--branco); }
  .mm.ela { align-self: flex-start; background: var(--creme-2); }
  .mm.crise { background: var(--crise); border: 1px solid var(--crise-borda); }
  .mm.dig { color: var(--texto-60); font-style: italic; }
  .rodape { display: block; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--texto-60); font-size: .85rem; white-space: normal; }
  .origem { display: block; margin-top: 4px; font-size: .75rem; color: var(--texto-60); }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .acoes a { background: var(--azul-esc); color: var(--branco); text-decoration: none; padding: 8px 12px; border-radius: 12px; font-size: .9rem; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--creme); padding: 8px 0 16px; }
  input { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--texto-60); background: var(--creme); color: var(--texto); font: inherit; }
  form button { padding: 12px 16px; border: 0; border-radius: 12px; background: var(--azul-esc); color: var(--branco); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Mari</h1>
  <p class="aviso">Demonstração local da assistente do MARÉ. A Mari usa IA do Google. Não escreva seu nome, documentos ou dados de contato. A Mari não substitui um profissional. Em perigo, ligue <b>188</b> (CVV) ou <b>192</b>.</p>
  <div class="rapidos" aria-label="Mensagens rápidas">
    <button type="button">Estou ansioso</button>
    <button type="button">Estou com vontade de apostar</button>
    <button type="button">Estou triste</button>
    <button type="button">Estou cansado</button>
    <button type="button">Estou em paz</button>
  </div>
  <div id="msgs" role="log" aria-live="polite"></div>
  <form id="form">
    <label for="msg" hidden>Mensagem</label>
    <input id="msg" maxlength="500" autocomplete="off" placeholder="Escreva para a Mari">
    <button type="submit">Enviar</button>
  </form>
</main>
<script type="module" src="chat.js"></script>
</body>
</html>
